<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Campus Lost &amp; Found – GLA University</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f6f7f4;
        --card: #fff;
        --ink: #14302f; 
        --mut: #5d6f6c;
        --line: #dde3df;
        --brand: #14302f;
        --gold: #c8962e;
        --lost: #b8432a;
        --lostbg: #fbe9e4;
        --found: #1d7a58;
        --foundbg: #def3ea;
        --warn: #8a6100;
        --warnbg: #fbf0d3;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0f1b1a;
          --card: #172625;
          --ink: #e8efec;
          --mut: #9bb0ab;
          --line: #2a3d3b;
          --brand: #e8efec;
          --lostbg: #3b1f19;
          --foundbg: #13362a;
          --warnbg: #3a2e0d;
          --lost: #ff9c85;
          --found: #6fd6aa;
          --warn: #f0c867;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0f1b1a;
        --card: #172625;
        --ink: #e8efec;
        --mut: #9bb0ab;
        --line: #2a3d3b;
        --brand: #e8efec;
        --lostbg: #3b1f19;
        --foundbg: #13362a;
        --warnbg: #3a2e0d;
        --lost: #ff9c85;
        --found: #6fd6aa;
        --warn: #f0c867;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family:
          "Bricolage Grotesque",
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        line-height: 1.5;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      :focus-visible {
        outline: 3px solid var(--gold);
        outline-offset: 2px;
      }
      .wrap {
        max-width: 1080px;
        margin: 0 auto;
        padding: 0 20px;
      }
      header {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        background: var(--bg);
        border-bottom: 1px solid var(--line);
        z-index: 5;
      }
      .nav {
        display: flex;
        align-items: center;
        gap: 20px;
        height: 64px;
      }
      .brand {
        font-weight: 800;
        font-size: 19px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .logo {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        background: var(--brand);
        color: var(--bg);
        display: grid;
        place-items: center;
        font-size: 15px;
      }
      nav {
        display: flex;
        gap: 4px;
        margin-left: auto;
        overflow-x: auto;
      }
      nav a {
        padding: 8px 12px;
        border-radius: 8px;
        color: var(--mut);
        font-weight: 600;
        white-space: nowrap;
      }
      nav a.on {
        background: var(--brand);
        color: var(--bg);
      }
      .who {
        border: 1px solid var(--line);
        background: var(--card);
        border-radius: 999px;
        padding: 6px 12px;
        cursor: pointer;
        white-space: nowrap;
        font-size: 14px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border: 0;
        border-radius: 10px;
        padding: 12px 20px;
        font-weight: 700;
        cursor: pointer;
        background: var(--brand);
        color: var(--bg);
      }
      .btn.lost {
        background: var(--lost);
        color: #fff;
      }
      .btn.found {
        background: var(--found);
        color: #fff;
      }
      .btn.ghost {
        background: transparent;
        color: var(--ink);
        border: 1px solid var(--line);
      }
      .btn.sm {
        padding: 8px 14px;
        font-size: 14px;
      }
      .hero {
        padding: 56px 0 36px;
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        gap: 40px;
        align-items: center;
      }
      h1 {
        font-size: clamp(34px, 5.5vw, 58px);
        line-height: 1.04;
        margin: 0 0 16px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      h2 {
        font-size: 26px;
        margin: 0 0 4px;
        letter-spacing: -0.01em;
      }
      .lead {
        color: var(--mut);
        font-size: 18px;
        max-width: 52ch;
        margin: 0 0 24px;
      }
      .search {
        display: flex;
        gap: 8px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 8px;
        max-width: 520px;
      }
      .search input {
        flex: 1;
        border: 0;
        background: transparent;
        padding: 8px 10px;
        min-width: 0;
      }
      .cta {
        display: flex;
        gap: 12px;
        margin-top: 16px;
        flex-wrap: wrap;
      }
      .panel {
        background: var(--brand);
        color: var(--bg);
        border-radius: 20px;
        padding: 28px;
      }
      .panel h3 {
        margin: 0 0 14px;
        font-size: 18px;
      }
      .panel ol {
        margin: 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 14px;
      }
      .panel li {
        display: grid;
        grid-template-columns: 30px 1fr;
        gap: 12px;
        font-size: 15px;
      }
      .panel b {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: var(--gold);
        color: #14302f;
      }
      .panel span {
        opacity: 0.8;
        display: block;
        font-size: 13px;
      }
      section {
        padding: 28px 0;
      }
      .head {
        display: flex;
        justify-content: space-between;
        align-items: end;
        gap: 12px;
        margin-bottom: 18px;
        flex-wrap: wrap;
      }
      .sub {
        color: var(--mut);
        margin: 0;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 16px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        overflow: hidden;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        text-align: left;
        padding: 0;
        transition: border-color 0.15s;
      }
      .card:hover {
        border-color: var(--gold);
      }
      .thumb {
        height: 130px;
        display: grid;
        place-items: center;
        font-size: 40px;
        font-weight: 800;
        background-size: cover;
        background-position: center;
      }
      .thumb.lost {
        background-color: var(--lostbg);
        color: var(--lost);
      }
      .thumb.found {
        background-color: var(--foundbg);
        color: var(--found);
      }
      .cb {
        padding: 14px 16px;
        display: grid;
        gap: 6px;
      }
      .cb strong {
        font-size: 16px;
      }
      .meta {
        color: var(--mut);
        font-size: 13px;
      }
      .tag {
        display: inline-block;
        font-size: 12px;
        font-weight: 700;
        border-radius: 6px;
        padding: 2px 8px;
      }
      .tag.lost {
        background: var(--lostbg);
        color: var(--lost);
      }
      .tag.found {
        background: var(--foundbg);
        color: var(--found);
      }
      .tag.pending {
        background: var(--warnbg);
        color: var(--warn);
      }
      .tag.done {
        background: var(--foundbg);
        color: var(--found);
      }
      .tag.rej {
        background: var(--lostbg);
        color: var(--lost);
      }
      .filters {
        display: grid;
        grid-template-columns: 2fr 1fr 1fr 1fr;
        gap: 10px;
        margin-bottom: 18px;
      }
      .in {
        width: 100%;
        border: 1px solid var(--line);
        background: var(--card);
        border-radius: 10px;
        padding: 11px 12px;
      }
      label {
        display: grid;
        gap: 6px;
        font-weight: 600;
        font-size: 14px;
      }
      .form {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 24px;
        display: grid;
        gap: 16px;
        max-width: 760px;
      }
      .row2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .seg {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .seg input {
        position: absolute;
        opacity: 0;
      }
      .seg label {
        border: 2px solid var(--line);
        border-radius: 12px;
        padding: 14px;
        cursor: pointer;
        font-weight: 700;
        text-align: center;
      }
      .seg input:checked + span {
        color: #fff;
      }
      .seg label:has(input[value="lost"]:checked) {
        background: var(--lost);
        border-color: var(--lost);
        color: #fff;
      }
      .seg label:has(input[value="found"]:checked) {
        background: var(--found);
        border-color: var(--found);
        color: #fff;
      }
      .seg label:has(input:focus-visible) {
        outline: 3px solid var(--gold);
      }
      .table {
        width: 100%;
        border-collapse: collapse;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        overflow: hidden;
        font-size: 14px;
      }
      .table th,
      .table td {
        padding: 12px 14px;
        text-align: left;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }
      .table th {
        background: var(--bg);
        color: var(--mut);
        font-weight: 600;
      }
      .scroll {
        overflow-x: auto;
      }
      .steps {
        display: flex;
        gap: 6px;
        margin-top: 6px;
      }
      .steps i {
        flex: 1;
        height: 6px;
        border-radius: 3px;
        background: var(--line);
      }
      .steps i.on {
        background: var(--found);
      }
      .ov {
        position: fixed;
        inset: 0;
        background: rgba(10, 20, 19, 0.6);
        display: grid;
        place-items: center;
        padding: 16px;
        z-index: 20;
        overflow: auto;
      }
      .modal {
        background: var(--card);
        border-radius: 18px;
        max-width: 520px;
        width: 100%;
        padding: 24px;
        display: grid;
        gap: 14px;
        max-height: 92vh;
        overflow: auto;
      }
      .modal .thumb {
        border-radius: 12px;
        height: 170px;
      }
      dl {
        display: grid;
        grid-template-columns: 100px 1fr;
        gap: 6px 12px;
        margin: 0;
        font-size: 14px;
      }
      dt {
        color: var(--mut);
      }
      dd {
        margin: 0;
      }
      .empty {
        border: 1px dashed var(--line);
        border-radius: 14px;
        padding: 36px;
        text-align: center;
        color: var(--mut);
      }
      .match {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px 14px;
        margin-top: 10px;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: calc(24px + env(safe-area-inset-bottom, 0px));
        transform: translateX(-50%);
        background: var(--brand);
        color: var(--bg);
        padding: 12px 20px;
        border-radius: 10px;
        z-index: 30;
        font-weight: 600;
      }
      footer {
        border-top: 1px solid var(--line);
        margin-top: 40px;
        padding: 24px 0;
        color: var(--mut);
        font-size: 14px;
      }
      @media (max-width: 760px) {
        .hero {
          grid-template-columns: 1fr;
          padding-top: 32px;
        }
        .filters {
          grid-template-columns: 1fr 1fr;
        }
        .filters .in:first-child {
          grid-column: 1/-1;
        }
        .row2 {
          grid-template-columns: 1fr;
        }
        .brand span.t {
          display: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }

      .chip {
        display: inline-block;
        font-size: 12px;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 1px 8px;
        color: var(--mut);
      }
      .auth {
        max-width: 460px;
        margin: 40px auto;
      }
      .bell {
        position: relative;
        border: 1px solid var(--line);
        background: var(--card);
        border-radius: 999px;
        width: 38px;
        height: 38px;
        cursor: pointer;
      }
      .bell b {
        position: absolute;
        top: -4px;
        right: -4px;
        background: var(--lost);
        color: #fff;
        border-radius: 999px;
        font-size: 11px;
        padding: 0 6px;
      }
      .rolepick {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }
      .rolepick button {
        border: 2px solid var(--line);
        background: var(--card);
        border-radius: 10px;
        padding: 10px;
        font-weight: 700;
        cursor: pointer;
      }
      .rolepick .on {
        border-color: var(--gold);
        background: var(--warnbg);
      }
      .chk {
        display: flex;
        gap: 8px;
        align-items: center;
        font-weight: 400;
      }
      .chk input {
        width: auto;
      }
      .portalLink {
        color: var(--mut);
        font-size: 14px;
        font-weight: 600;
        text-align: center;
      }
      .portalLink:hover {
        color: var(--ink);
        text-decoration: underline;
      }
      .adminAuth {
        border-top: 4px solid var(--gold);
      }
      .adminEyebrow {
        color: var(--warn);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.12em;
      }
      .authError {
        color: var(--lost);
        font-size: 14px;
        font-weight: 600;
      }
      .nav {
        gap: 12px;
      }
      nav {
        margin-left: 16px;
      }
      @media (max-width: 760px) {
        .filters {
          grid-template-columns: 1fr 1fr !important;
        }
        .who {
          font-size: 12px;
          padding: 6px 8px;
        }
      }

      / body {
        background-image:
          radial-gradient(ellipse at 100% 0%, rgba(200, 150, 46, 0.09), transparent 34%),
          linear-gradient(180deg, rgba(255, 255, 255, 0.28), transparent 360px);
      }
      header {
        backdrop-filter: blur(14px);
        background: color-mix(in srgb, var(--bg) 92%, transparent);
      }
      .nav {
        min-height: 70px;
        height: auto;
      }
      .brand {
        font-size: 18px;
        letter-spacing: 0;
      }
      .logo {
        width: 36px;
        height: 36px;
        border-radius: 11px;
        box-shadow: 0 4px 12px rgba(20, 48, 47, 0.14);
      }
      nav a {
        transition:
          background 0.18s ease,
          color 0.18s ease;
      }
      nav a:not(.on):hover {
        background: var(--card);
        color: var(--ink);
      }
      .who {
        transition:
          border-color 0.18s ease,
          background 0.18s ease;
      }
      .who:hover {
        border-color: var(--gold);
        background: var(--warnbg);
      }
      .hero {
        padding: 64px 0 42px;
        gap: 56px;
      }
      h1 {
        font-size: 48px;
        line-height: 1.06;
        letter-spacing: 0;
        max-width: 13ch;
      }
      h2 {
        letter-spacing: 0;
      }
      .lead {
        font-size: 17px;
        line-height: 1.65;
      }
      .search {
        border-radius: 12px;
        box-shadow: 0 10px 28px rgba(20, 48, 47, 0.06);
      }
      .search:focus-within {
        border-color: var(--gold);
        box-shadow: 0 0 0 3px rgba(200, 150, 46, 0.14);
      }
      .btn {
        border-radius: 8px;
        transition:
          transform 0.16s ease,
          filter 0.16s ease,
          box-shadow 0.16s ease;
      }
      .btn:hover {
        filter: brightness(1.08);
        transform: translateY(-1px);
        box-shadow: 0 5px 14px rgba(20, 48, 47, 0.13);
      }
      .btn:active {
        transform: translateY(0);
      }
      .panel {
        border-radius: 14px;
        padding: 30px;
        box-shadow: 0 18px 40px rgba(20, 48, 47, 0.12);
      }
      .panel h3 {
        font-size: 20px;
      }
      section {
        padding: 34px 0;
      }
      .head {
        margin-bottom: 20px;
      }
      .head h2 {
        font-size: 25px;
      }
      .grid {
        gap: 18px;
      }
      .card {
        border-radius: 10px;
        transition:
          transform 0.18s ease,
          border-color 0.18s ease,
          box-shadow 0.18s ease;
      }
      .card:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 26px rgba(20, 48, 47, 0.09);
      }
      .thumb {
        height: 148px;
      }
      .cb {
        padding: 16px;
      }
      .cb strong {
        line-height: 1.3;
      }
      .form {
        border-radius: 12px;
        padding: 28px;
        box-shadow: 0 16px 40px rgba(20, 48, 47, 0.07);
      }
      .auth {
        margin: 56px auto;
        gap: 18px;
      }
      .auth > h2 {
        font-size: 28px;
      }
      .in {
        border-radius: 8px;
        min-height: 44px;
        transition:
          border-color 0.15s ease,
          box-shadow 0.15s ease;
      }
      .in:focus {
        outline: 0;
        border-color: var(--gold);
        box-shadow: 0 0 0 3px rgba(200, 150, 46, 0.14);
      }
      textarea.in {
        min-height: 100px;
        resize: vertical;
      }
      .rolepick button {
        border-radius: 8px;
        transition:
          border-color 0.15s ease,
          background 0.15s ease;
      }
      .table {
        border-radius: 10px;
      }
      .tag {
        border-radius: 5px;
      }
      .empty {
        background: var(--card);
        border-radius: 10px;
      }
      .modal {
        border-radius: 12px;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.24);
      }
      footer {
        line-height: 1.7;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background-image: radial-gradient(ellipse at 100% 0%, rgba(200, 150, 46, 0.06), transparent 34%);
        }
      }
      @media (max-width: 760px) {
        .hero {
          gap: 28px;
          padding: 38px 0 24px;
        }
        h1 {
          font-size: 38px;
          max-width: 15ch;
        }
        .panel {
          padding: 24px;
        }
        .auth {
          margin: 32px auto;
        }
        .form {
          padding: 22px;
        }
        .thumb {
          height: 138px;
        }
      }
      @media (max-width: 480px) {
        .wrap {
          padding: 0 16px;
        }
        .nav {
          gap: 8px;
          min-height: 62px;
        }
        .brand {
          font-size: 16px;
        }
        .logo {
          width: 32px;
          height: 32px;
        }
        nav a {
          padding: 7px 9px;
          font-size: 13px;
        }
        .who {
          max-width: 128px;
          overflow: hidden;
          text-overflow: ellipsis;
        }
        .cta .btn {
          flex: 1;
        }
        .search {
          gap: 3px;
        }
        .search .btn {
          padding: 10px 13px;
        }
        .rolepick {
          grid-template-columns: 1fr 1fr;
        }
        .rolepick button:last-child {
          grid-column: 1/-1;
        }
        .head h2 {
          font-size: 22px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .btn,
        .card,
        nav a,
        .who,
        .in,
        .rolepick button {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script>
      const { useState, useEffect } = React,
        h = React.createElement;
      const CATS = ["Electronics", "ID & Cards", "Books & Notes", "Bags", "Keys", "Clothing", "Accessories", "Other"];
      const LOCS = [
        "Library",
        "Main Gate",
        "Cafeteria",
        "Lab Block",
        "Classroom Block",
        "Faculty Room",
        "Hostel",
        "Sports Ground",
        "Auditorium",
      ];
      const ROLES = ["Student", "Faculty", "Staff"];
      const DEMO_ADMIN_PASSWORD = "GLAadmin@2026";
      const dAgo = (n) => {
        const d = new Date("2026-10-02");
        d.setDate(d.getDate() - n);
        return d.toISOString().slice(0, 10);
      };
      const fmt = (d) =>
        new Date(d).toLocaleDateString("en-IN", {
          day: "numeric",
          month: "short",
          year: "numeric",
        });
      const mk = (id, type, title, cat, loc, n, color, brand, model, marks, desc, by, role, status = "Open") => ({
        id,
        type,
        title,
        cat,

            if (o.cat === it.cat) s += 3;
            if (o.loc === it.loc) s += 2;
            if (o.color && o.color === it.color) s++;
            if (o.brand && o.brand === it.brand) s++;
            if (Math.abs(new Date(o.date) - new Date(it.date)) <= 3 * 864e5) s++;
            const b = w(o.title + " " + o.desc);
            w(it.title + " " + it.desc).forEach((x) => b.has(x) && s++);
            return { o, s };

              ),
            ),
          ),
          h("h2", null, "Claim requests"),
          h(
            "div",
            { className: "scroll" },
            h(
              "table",
              { className: "table" },
              h(
                "tbody",
                null,
                h(
                  "tr",
                  null,
                  ["Item", "Claimant", "Proof", "Status", ""].map((t, k) => h("th", { key: k }, t)),
                ),
                x.claims.map((c) =>
                  h(
                    "tr",
                    { key: c.id },
                    h("td", null, x.items.find((i) => i.id === c.item)?.title),
                    h("td", null, c.by, h("br"), h("span", { className: "meta" }, c.contact)),
                    h("td", null, c.proof),
                    h(
                      "td",
                      null,
                      T(c.status, c.status === "Pending" ? "pending" : c.status === "Approved" ? "done" : "rej"),
                    ),
                    h(
                      "td",
                      null,
                      c.status === "Pending" && [
                        h(
                          "button",
                          {
                            key: 1,
                            className: "btn sm",
                            onClick: () => act(c, true),
                          },
                          "Approve",
                        ),
                        " ",
                        h(
                          "button",
                          {
                            key: 2,
                            className: "btn ghost sm",
                            onClick: () => act(c, false),
                          },
                          "Reject",
                        ),
                      ],
                    ),
                  ),
                ),
              ),
            ),
          ),
          h("h2", { style: { marginTop: 28 } }, "All reports"),
          h(
            "div",
            { className: "scroll" },
            h(
              "table",
              { className: "table" },
              h(
                "tbody",
                null,
                h(
                  "tr",
                  null,
                  ["Item", "Type", "Reported by", "Status", ""].map((t, k) => h("th", { key: k }, t)),
                ),
                x.items.map((i) =>
                  h(
                    "tr",
                    { key: i.id },
                    h("td", null, i.title),
                    h("td", null, T(i.type, i.type)),
                    h("td", null, i.by, " ", h("span", { className: "chip" }, i.role)),
                    h("td", null, i.status),
                    h(
                      "td",
                      null,
                      h(
                        "button",
                        {
                          className: "btn ghost sm",
                          onClick: () => {
                            x.setItems(x.items.filter((z) => z.id !== i.id));
                            x.say("Report removed.");
                          },
                        },
                        "Remove",
                      ),
                    ),
                  ),
                ),
              ),
            ),
          ),
        );
      }

      function Modal({ x }) {
        const m = x.m;
        if (!m) return null;
        let body;
        if (m.k === "detail") {
          const i = x.items.find((z) => z.id === m.id);
          body = [
            h(Thumb, { key: 0, i }),
            h(
              "div",
              { key: 1 },
              T(i.type === "lost" ? "Lost" : "Found", i.type),
              " ",
              T(i.status, i.status === "Returned" ? "done" : i.status === "Open" ? "" : "pending"),
            ),
            h("h2", { key: 2 }, i.title),
            h(Steps, { key: 3, s: i.status }),
            h("p", { key: 4, style: { margin: 0 } }, i.desc),
            h(
              "dl",
              { key: 5 },
              [
                ["Category", i.cat],
                ["Location", i.loc],
                ["Date", fmt(i.date)],
                ["Colour", i.color],
                ["Brand", i.brand],
                ["Model", i.model],
                ["Unique marks", i.marks],
                ["Reported by", `${i.by} (${i.role})`],
                ["Course / dept", i.info],
              ]
                .filter((r) => r[1])
                .map((r) => [h("dt", { key: r[0] + "t" }, r[0]), h("dd", { key: r[0] + "d" }, r[1])]),
            ),
            h(
              "div",
              {
                key: 6,
                style: { display: "flex", gap: 10, justifyContent: "flex-end" },
              },
              h("button", { className: "btn ghost", onClick: x.close }, "Close"),
              i.status === "Open" &&
                h(
                  "button",
                  {
                    className: "btn",
                    onClick: () => x.setM({ k: "claim", id: i.id }),
                  },
                  i.type === "found" ? "This is mine: claim it" : "I found this item",
                ),
            ),
          ];
        }
        if (m.k === "claim")
          body = [
            h("h2", { key: 0 }, "Verify ownership"),
            h(
              "p",
              { key: 1, className: "sub", style: { margin: 0 } },
              "Staff will check your answer before handing the item over. Don't share it publicly.",
            ),
            h(
              "form",
              {
                key: 2,
                style: { display: "grid", gap: 14 },
                onSubmit: (e) => {
                  e.preventDefault();
                  const d = new FormData(e.target);
                  x.setClaims([
                    ...x.claims,
                    {
                      id: x.claims.length + 1,
                      item: m.id,
                      by: x.user.name,
                      proof: d.get("proof"),
                      contact: d.get("contact"),
                      status: "Pending",
                      mine: true,
                    },
                  ]);
                  x.setItems(x.items.map((i) => (i.id === m.id ? { ...i, status: "Claim pending" } : i)));
                  x.note("Your claim was sent for verification.");
                  x.close();
                  x.say("Claim sent. Staff will review it.");
                },
              },
              Lbl(
                "What only the owner would know?",
                h("textarea", {
                  className: "in",
                  name: "proof",
                  rows: 4,
                  required: true,
                  placeholder: "Contents, scratches, wallpaper, serial number…",
                }),
              ),
              Lbl(
                "Contact email or phone",
                h("input", {
                  className: "in",
                  name: "contact",
                  required: true,
                }),
              ),
              h(
                "div",
                {
                  style: {
                    display: "flex",
                    gap: 10,
                    justifyContent: "flex-end",
                  },
                },
                h("button", { type: "button", className: "btn ghost", onClick: x.close }, "Cancel"),
                h("button", { className: "btn" }, "Send claim"),
              ),
            ),
          ];
        if (m.k === "done")
          body = [
            h("h2", { key: 0 }, "Report submitted"),
            h(
              "p",
              { key: 1, className: "sub", style: { margin: 0 } },
              `Your ${m.it.type} report is now visible to staff.`,
            ),
            m.m.length
              ? h(
                  "div",
                  { key: 2 },
                  h("strong", null, "Possible matches"),
                  h(
                    "p",
                    { className: "meta", style: { margin: 0 } },
                    "Suggestions only. Ownership is confirmed after verification.",
                  ),
                  m.m.map((y) =>
                    h(
                      "div",
                      { className: "match", key: y.o.id },
                      h(
                        "div",
                        null,
                        h("strong", null, y.o.title),
                        h("div", { className: "meta" }, `${y.o.loc} · ${fmt(y.o.date)}`),
                      ),
                      h(
                        "button",
                        {
                          className: "btn sm",
                          onClick: () => x.setM({ k: "detail", id: y.o.id }),
                        },
                        "View",
                      ),
                    ),
                  ),
                )
              : h(
                  "p",
                  { key: 2, style: { margin: 0 } },
                  "No matches yet. You will be notified if a similar item is reported.",
                ),
            h(
              "div",
              {
                key: 3,
                style: { display: "flex", justifyContent: "flex-end" },
              },
              h("a", { className: "btn", href: "#/my", onClick: x.close }, "Go to my reports"),
            ),
          ];
        if (m.k === "notes")
          body = [
            h("h2", { key: 0 }, "Notifications"),
            x.notes.length
              ? x.notes.map((n, k) =>
                  h("div", { className: "match", key: k }, h("span", null, n.t), h("span", { className: "meta" }, n.d)),
                )
              : h(
                  "p",
                  { key: 1, className: "sub", style: { margin: 0 } },
                  "No notifications yet. Updates about your reports and claims appear here.",
                ),
            h(
              "div",
              { key: 9, style: { textAlign: "right" } },
              h("button", { className: "btn ghost", onClick: x.close }, "Close"),
            ),
          ];
        return h(
          "div",
          {
            className: "ov",
            onMouseDown: (e) => e.target === e.currentTarget && x.close(),
          },
          h("div", { className: "modal", role: "dialog", "aria-modal": true }, body),
        );
      }

      function App() {
        const [user, setUser] = useState(null),
          [hash, setHash] = useState(location.hash || "#/"),
          [items, setItems] = useState(SEED),
          [claims, setClaims] = useState([
            {
              id: 1,
              item: 2,
              by: "Mohit Jain",
              proof: "Wallpaper is a mountain; crack at bottom-left of the case.",
              contact: "mohit@gla.ac.in",
              status: "Pending",
            },
          ]),
          [notes, setNotes] = useState([]),
          [m, setM] = useState(null),
          [toast, setToast] = useState(null),
          [F, setF] = useState({
            q: "",
            type: "all",
            cat: "all",
            loc: "all",
            role: "all",
          });
        useEffect(() => {
          const f = () => {
            setHash(location.hash || "#/");
            setM(null);
            scrollTo(0, 0);
          };
          addEventListener("hashchange", f);
          const k = (e) => e.key === "Escape" && setM(null);
          addEventListener("keydown", k);
          return () => {
            removeEventListener("hashchange", f);
            removeEventListener("keydown", k);
          };
        }, []);
        useEffect(() => {
          if (user?.admin && !hash.startsWith("#/admin")) location.hash = "#/admin";
          else if (user && !user.admin && hash.startsWith("#/admin")) location.hash = "#/";
        }, [user, hash]);
        const say = (t) => {
          setToast(t);
          setTimeout(() => setToast(null), 2800);
        };
        const note = (t) =>
          setNotes((n) => [
            {
              t,
              d: new Date().toLocaleTimeString([], {
                hour: "2-digit",
                minute: "2-digit",
              }),
            },
            ...n,
          ]);
        const x = {
          user,
          items,
          setItems,
          claims,
          setClaims,
          notes,
          note,
          say,
          m,
          setM,
          close: () => setM(null),
          open: (id) => setM({ k: "detail", id }),
          F,
          setF,
        };
        const r = hash.split("?")[0].slice(2) || "home";
        const P = { home: Home, browse: Browse, report: Report, my: My, admin: Admin }[r] || Home;
        const cur = P === Home ? "home" : r;
        const isAdminPortal = !!user?.admin || (!user && r === "admin");
        const links = isAdminPortal
          ? [["admin", "Dashboard", "admin"]]
          : [["", "Home", "home"], ["browse", "Browse", "browse"], ["report", "Report", "report"], ["my", "My reports", "my"]];
        return h(
          React.Fragment,
          null,
          h(
            "header",
            null,
            h(
              "div",
              { className: "wrap nav" },
              h(
                "a",
                { className: "brand", href: isAdminPortal ? "#/admin" : "#/" },
                h("div", { className: "logo" }, "🔎"),
                h("span", { className: "t" }, isAdminPortal ? "Campus Lost & Found · Admin" : "Campus Lost & Found"),
              ),
              user &&
                h(
                  "nav",
                  null,
                  links.map(([p, l, k]) =>
                    h(
                      "a",
                      {
                        key: k,
                        href: "#/" + p,
                        className: k === cur ? "on" : "",
                      },
                      l,
                    ),
                  ),
                ),
              user &&
                h(
                  "button",
                  {
                    className: "bell",
                    style: { marginLeft: "auto" },
                    "aria-label": "Notifications",
                    onClick: () => setM({ k: "notes" }),
                  },
                  "🔔",
                  notes.length > 0 && h("b", null, notes.length),
                ),
              user &&
                h(
                  "button",
                  {
                    className: "who",
                    title: "Sign out",
                    onClick: () => {
                      setUser(null);
                      if (!user.admin) location.hash = "#/";
                    },
                  },
                  `${user.name.split(" ")[0]} · ${user.role} · Sign out`,
                ),
            ),
          ),
          h(
            "main",
            { className: "wrap" },
            user
              ? h(user.admin ? Admin : P, { x })
              : isAdminPortal
              ? h(AdminLogin, {
                  onLogin: (u) => {
                    setUser(u);
                    say("Welcome, " + u.name.split(" ")[0]);
                  },
                })
              : h(Login, {
                  onLogin: (u) => {
                    setUser(u);
                    say("Welcome, " + u.name.split(" ")[0]);
                  },
                }),
          ),
          h(
            "footer",
            null,
            h(
              "div",
              { className: "wrap" },
              "GLA University, Mathura · Online Lost & Found Portal. Student project prototype with demo data (resets on refresh).",
            ),
          ),
          h(Modal, { x }),
          toast && h("div", { className: "toast", role: "status" }, toast),
        );
      }
      ReactDOM.createRoot(document.getElementById("root")).render(h(App));
    </script>
  </body>
</html>
